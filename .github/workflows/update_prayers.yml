name: Fully Automated Prayer Times Updater

on:
  workflow_dispatch: # Allows you to run it manually with 1 click anytime from GitHub UI
  schedule:
    # Automatically runs every year on November 1st at 00:00 UTC to generate next year's schedule early
    - cron: '0 0 1 11 *'

jobs:
  scrape-mora:
    runs-on: ubuntu-latest
    
    # Grants the GitHub bot permission to write commits back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Scraper for Next Year
        run: |
          # Automatically calculate next year (e.g. if run in Nov 2026, it scrapes 2027)
          NEXT_YEAR=$(date -d "+2 months" +%Y)
          echo "Targeting Year: $NEXT_YEAR"
          python nja_waktu_solat_scraper_mora.py $NEXT_YEAR

      - name: Commit and push updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add brunei_prayers.json
          git commit -m "🤖 Automated: Updated brunei_prayers.json for next year" || echo "No changes to commit"
          git push
