name: Update Prayer Times

on:
  workflow_dispatch: # Allows you to run it manually with 1 click from GitHub
  schedule:
    - cron: '0 0 1 12 *' # Runs automatically every year on December 1st at midnight

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        run: python nja_waktu_solat_scraper_mora.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add brunei_prayers.json brunei_prayer_times_*.csv
          git commit -m "Auto-update prayer times for next year" || echo "No changes to commit"
          git push
