<!--
Page Name: index.html
Version: 3.1.0
Description: Condensed UI to fit single screens, glassmorphism footer for contrast against celestial engine, text-selection and double-tap-to-zoom disabled for native feel.
-->
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Waktu Solat BWN</title>

  <!-- PWA Core Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="application-name" content="Waktu BWN">
  <meta name="apple-mobile-web-app-title" content="Waktu BWN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050505">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <style>
    :root {
      /* Base Colors */
      --bg-base: #050505;
      
      /* Glassmorphism Surface */
      --bg-surface: rgba(18, 18, 18, 0.65);
      --bg-surface-elevated: rgba(30, 30, 30, 0.7);
      --bg-surface-active: rgba(23, 23, 23, 0.85);
      
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-active: rgba(82, 82, 82, 0.8);
      
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --accent-primary: #e5e5e5;
      --accent-highlight: #d4d4d4;

      /* Status Indicators */
      --badge-ok-bg: rgba(52, 211, 153, 0.2);
      --badge-ok-color: #34d399; 
      --badge-haram-bg: rgba(244, 63, 94, 0.2);
      --badge-haram-color: #fb7185; 

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Disable Highlights and Double-Tap Zoom */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; /* Safari */
      -ms-user-select: none; /* IE 10+ */
      user-select: none; /* Standard */
      touch-action: manipulation; /* Disables double-tap to zoom */
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100dvh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      
      padding-top: calc(env(safe-area-inset-top, 20px) + 12px);
      /* Removed bottom padding from body to allow footer to flush to bottom */
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      
      -webkit-font-smoothing: antialiased;
      overflow: hidden; 
      position: relative;
    }

    /* Astronomical Sky Background Layer */
    #sky-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -2;
      transition: background 3s ease;
      background: var(--bg-base);
    }

    /* Sun / Moon Element */
    #celestial-body {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      z-index: -1;
      transform: translate(-50%, -50%);
      transition: top 2s ease-out, left 2s ease-out, box-shadow 3s ease, background 3s ease;
      opacity: 0; 
    }

    .app-wrapper {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px; /* Condensed gap */
      overflow: hidden; 
      z-index: 10;
    }

    /* Header */
    .header-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0; 
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--bg-surface-elevated);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 100%;
      height: 100%;
    }

    .header-title-box h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      text-transform: uppercase;
      line-height: 1.1;
      margin: 0;
    }

    .controls-cluster {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      background: var(--bg-surface);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .lang-switcher {
      display: flex;
      background-color: var(--bg-surface);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    /* Header Bottom Row (Date & District Dropdown) */
    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .date-text {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .district-select-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .district-select {
      appearance: none;
      background-color: transparent;
      border: 1px solid var(--border-active);
      color: var(--text-primary);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 18px 2px 6px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-family: var(--font-stack);
      -webkit-user-select: auto; /* Re-enable for dropdown */
      user-select: auto;
    }

    .district-select-wrapper::after {
      content: "▼";
      font-size: 0.45rem;
      color: var(--text-primary);
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* Condensed Hero Section */
    .hero-tracker {
      background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(10, 10, 10, 0.8) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0; 
    }

    .hero-tracker::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 150px;
      height: 100%;
      background: radial-gradient(circle at top right, var(--accent-glow) 0%, transparent 80%);
      pointer-events: none;
    }

    .hero-top-row {
      display: flex;
      flex-direction: column;
      gap: 0px;
      z-index: 1;
    }

    .hero-now-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .hero-name {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
    }

    .hero-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1;
      margin-top: 2px;
    }

    .progress-countdown {
      font-size: 0.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--border-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-primary);
      border-radius: 999px;
      box-shadow: 0 0 10px var(--accent-primary);
      transition: width 0.8s ease;
    }

    /* Scrollable Unified List */
    .prayer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      flex-grow: 1; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      padding-bottom: 8px;
    }

    .prayer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px;
      transition: all 0.2s ease;
      width: 100%;
      flex-shrink: 0; 
      backdrop-filter: blur(12px);
    }

    .prayer-row.is-fardhu {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
    }

    .prayer-row.is-secondary {
      background: rgba(10, 10, 10, 0.4);
      border: 1px dashed var(--border-subtle);
      padding: 6px 12px;
    }

    .prayer-row.is-active {
      background: linear-gradient(90deg, var(--bg-surface-active) 0%, rgba(10,10,10,0.6) 100%);
      border: 1px solid var(--border-active);
      box-shadow: inset 3px 0 0 var(--accent-primary);
    }

    .prayer-row.is-past {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .row-left-fardhu { width: 75px; font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }
    .row-left-sec { width: 75px; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

    .prayer-row.is-active .row-left-fardhu,
    .prayer-row.is-active .row-left-sec { color: var(--accent-primary); }

    .row-mid {
      flex: 1;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-start;
      padding: 0 4px;
    }

    .fiqh-badge {
      font-size: 0.55rem;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fiqh-badge.is-ok { background-color: var(--badge-ok-bg); color: var(--badge-ok-color); }
    .fiqh-badge.is-haram { background-color: var(--badge-haram-bg); color: var(--badge-haram-color); }

    .row-right-fardhu { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); text-align: right; }
    .row-right-sec { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-muted); text-align: right; }
    .prayer-row.is-active .row-right-fardhu, .prayer-row.is-active .row-right-sec { color: #ffffff; }

    /* Frosted Glass Footer to prevent unreadability over Sun Graphic */
    .site-footer {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-primary);
      line-height: 1.4;
      flex-shrink: 0; 
      padding: 6px 12px calc(env(safe-area-inset-bottom, 12px) + 6px) 12px;
      margin: auto -12px 0 -12px; /* Expands to touch edges */
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      border-radius: 12px 12px 0 0;
      z-index: 10;
    }

    .site-footer a { color: var(--text-secondary); text-decoration: none; }
  </style>
</head>
<body>

  <!-- Visual Layers -->
  <div id="sky-bg"></div>
  <div id="celestial-body"></div>

  <div class="app-wrapper">
    <header class="header-bar">
      <!-- Top Row -->
      <div class="header-top">
        <div class="brand-cluster">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M256 52c-2.8 14.3-9.8 27.4-20.2 37.7-10.3 10.3-23.4 17.4-37.7 20.2 14.3 2.8 27.4 9.8 37.7 20.2 10.3 10.3 17.4 23.4 20.2 37.7 2.8-14.3 9.8-27.4 20.2-37.7 10.3-10.3 23.4-17.4 37.7-20.2-14.3-2.8-27.4-9.8-37.7-20.2-10.4-10.3-17.4-23.4-20.2-37.7z" fill="#e5e5e5"/>
              <path d="M256 140c-58.8 0-112 38.5-128 100h256c-16-61.5-69.2-100-128-100z" fill="#e5e5e5"/>
              <path d="M128 240v172c0 6.6 5.4 12 12 12h60v-92c0-31 14-56 56-56s56 25 56 56v92h60c6.6 0 12-5.4 12-12V240H128z" fill="#262626"/>
              <path d="M224 332c0-22.1 14.3-40 32-40s32 17.9 32 40v92h-64v-92z" fill="#e5e5e5"/>
              <path d="M81 222h18v190H36c-4.4 0-8-3.6-8-8V230c0-4.4 3.6-8 8-8h45zm332 0h18v190h-45c-4.4 0-8-3.6-8-8V230c0-4.4 3.6-8 8-8h45z" fill="#404040"/>
              <path d="M90 170c-13.3 0-24 20-24 50h48c0-30-10.7-50-24-50zm332 0c-13.3 0-24 20-24 50h48c0-30-10.7-50-24-50z" fill="#e5e5e5"/>
              <path d="M80 384h352v24H80z" fill="#e5e5e5"/>
            </svg>
          </div>
          <div class="header-title-box">
            <h1 id="ui-app-title">Waktu Solat BWN</h1>
          </div>
        </div>

        <div class="controls-cluster">
          <button class="icon-btn" id="visuals-toggle" onclick="toggleVisuals()">☀️</button>
          <div class="lang-switcher">
            <button id="lang-btn-ms" class="lang-btn active" onclick="setLanguage('ms')">BM</button>
            <button id="lang-btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
          </div>
        </div>
      </div>

      <!-- Bottom Row -->
      <div class="header-bottom">
        <span class="date-text" id="gregorian-date">-</span>
        <div class="district-select-wrapper">
          <select class="district-select" id="district-select" onchange="handleDistrictChange()">
            <option value="0">Brunei-Muara</option>
            <option value="3">Belait (+3 min)</option>
            <option value="1">Tutong (+1 min)</option>
            <option value="0">Temburong</option>
          </select>
        </div>
      </div>
    </header>

    <section class="hero-tracker">
      <div class="hero-top-row">
        <div class="hero-now-label" id="ui-now-label">Sekarang:</div>
        <div class="hero-name" id="hero-current-name">-</div>
        <div class="hero-time" id="hero-current-range">-</div>
      </div>
      <div class="progress-container">
        <div class="progress-countdown" id="hero-countdown-text">-</div>
        <div class="progress-track">
          <div class="progress-fill" id="hero-progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- Unified Single Screen List -->
    <main class="prayer-list" id="prayer-list-container"></main>

    <footer class="site-footer">
      <div>
        <a href="https://www.mora.gov.bn/SitePages/WaktuSembahyang.aspx" target="_blank" rel="noopener noreferrer">Sumber: KHEU Brunei Darussalam</a>
      </div>
      <div>
        &copy; 2026 <a href="https://github.com/naqiuddinihsan" target="_blank" rel="noopener noreferrer">Qwamii / Naqiuddin Ihsan</a>
      </div>
    </footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    const GITHUB_JSON_URL = "https://raw.githubusercontent.com/naqiuddinihsan/waktu-solat-brunei/main/brunei_prayers.json";
    
    let currentLang = "ms";
    let visualsEnabled = true;

    if (localStorage.getItem('bwn_visuals') === 'false') {
      visualsEnabled = false;
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    const I18N = {
      ms: {
        appTitle: "Waktu Solat BWN",
        nowLabel: "Sekarang:",
        enteredAt: "Masuk pada",
        toNext: "ke",
        localeDate: "ms-MY",
        yesterdaySuffix: "(Malam Tadi)",
        tomorrowSuffix: "(Esok)",
        districts: [
          { val: 0, text: "Brunei-Muara" },
          { val: 3, text: "Belait (+3 min)" },
          { val: 1, text: "Tutong (+1 min)" },
          { val: 0, text: "Temburong" }
        ],
        prayers: {
          imsak: "Imsak", subuh: "Subuh", syuruk: "Syuruk", duha: "Duha",
          zuhur: "Zuhur", asar: "Asar", maghrib: "Maghrib", isya: "Isya'"
        },
        fiqh: { qabliyyah: "Qabliyyah", ba_diyyah: "Ba'diyyah", witir: "Witir" }
      },
      en: {
        appTitle: "Waktu Solat BWN",
        nowLabel: "Now:",
        enteredAt: "Entered at",
        toNext: "to",
        localeDate: "en-GB",
        yesterdaySuffix: "(Last Night)",
        tomorrowSuffix: "(Tomorrow)",
        districts: [
          { val: 0, text: "Brunei-Muara" },
          { val: 3, text: "Belait (+3 min)" },
          { val: 1, text: "Tutong (+1 min)" },
          { val: 0, text: "Temburong" }
        ],
        prayers: {
          imsak: "Imsak", subuh: "Fajr", syuruk: "Sunrise", duha: "Dhuha",
          zuhur: "Zuhr", asar: "Asr", maghrib: "Maghrib", isya: "Isha'"
        },
        fiqh: { qabliyyah: "Qabliyyah", ba_diyyah: "Ba'diyyah", witir: "Witir" }
      }
    };

    const ALL_KEYS = ["imsak", "subuh", "syuruk", "duha", "zuhur", "asar", "maghrib", "isya"];

    let cachedSchedule = {
      imsak: "04:42", subuh: "04:52", syuruk: "06:09", duha: "06:31",
      zuhur: "12:13", asar: "15:22", maghrib: "18:15", isya: "19:24"
    };
    let hijrahString = "13 Rabiulakhir 1448 H";

    function timeStringToMinutes(str) {
      const parts = str.split(":");
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function minutesToDisplay(mins) {
      let normalized = mins % 1440;
      let h = Math.floor(normalized / 60);
      let m = normalized % 60;
      let period = h >= 12 ? "PM" : "AM";
      let displayH = h % 12;
      displayH = displayH === 0 ? 12 : displayH;
      let displayM = m < 10 ? "0" + m : m;
      return displayH + ":" + displayM + " " + period;
    }

    function populateDistricts() {
      const sel = document.getElementById("district-select");
      const currentVal = sel.value || "0";
      sel.innerHTML = "";
      I18N[currentLang].districts.forEach(d => {
        let opt = document.createElement("option");
        opt.value = d.val;
        opt.textContent = d.text;
        if (d.val == currentVal && d.text === sel.options[sel.selectedIndex]?.text) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function handleDistrictChange() {
      updateTick();
    }

    function toggleVisuals() {
      visualsEnabled = !visualsEnabled;
      localStorage.setItem('bwn_visuals', visualsEnabled);
      document.getElementById('visuals-toggle').textContent = visualsEnabled ? "☀️" : "🌙";
      updateTick();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById("lang-btn-ms").classList.toggle("active", lang === "ms");
      document.getElementById("lang-btn-en").classList.toggle("active", lang === "en");

      const t = I18N[currentLang];
      setText("ui-app-title", t.appTitle);
      document.title = t.appTitle;
      setText("ui-now-label", t.nowLabel);
      
      let savedIndex = document.getElementById("district-select").selectedIndex;
      populateDistricts();
      document.getElementById("district-select").selectedIndex = savedIndex > -1 ? savedIndex : 0;

      setDateHeaders();
      updateTick();
    }

    function getAdjustedSchedule() {
      const adjusted = {};
      const offset = parseInt(document.getElementById("district-select").value || 0);
      ALL_KEYS.forEach(function(key) {
        let baseMins = timeStringToMinutes(cachedSchedule[key]);
        adjusted[key] = baseMins + offset;
      });
      return adjusted;
    }

    function renderPrayerList(adjustedTimes, activeKey) {
      const list = document.getElementById("prayer-list-container");
      if (!list) return;
      list.innerHTML = "";

      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const t = I18N[currentLang];

      const sequence = [
        { key: "imsak", type: "secondary" },
        { key: "subuh", type: "fardhu", badges: [{ text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" }, { text: t.fiqh.ba_diyyah + " &#10007;", type: "is-haram" }] },
        { key: "syuruk", type: "secondary" },
        { key: "duha", type: "secondary" },
        { key: "zuhur", type: "fardhu", badges: [{ text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" }, { text: t.fiqh.ba_diyyah + " &#10003;", type: "is-ok" }] },
        { key: "asar", type: "fardhu", badges: [{ text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" }, { text: t.fiqh.ba_diyyah + " &#10007;", type: "is-haram" }] },
        { key: "maghrib", type: "fardhu", badges: [{ text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" }, { text: t.fiqh.ba_diyyah + " &#10003;", type: "is-ok" }] },
        { key: "isya", type: "fardhu", badges: [{ text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" }, { text: t.fiqh.ba_diyyah + " &#10003;", type: "is-ok" }, { text: t.fiqh.witir + " &#10003;", type: "is-ok" }] }
      ];

      sequence.forEach(function(item) {
        const row = document.createElement("div");
        row.className = "prayer-row is-" + item.type;

        const prayerMins = adjustedTimes[item.key];
        const prayerName = t.prayers[item.key];
        
        if (item.key === activeKey) {
          row.classList.add("is-active");
        } else if (prayerMins < currentMinutes) {
          row.classList.add("is-past");
        }

        let badgesHtml = '';
        if (item.badges) {
          item.badges.forEach(b => { badgesHtml += '<span class="fiqh-badge ' + b.type + '">' + b.text + '</span>'; });
        }

        const nameClass = item.type === "fardhu" ? "row-left-fardhu" : "row-left-sec";
        const timeClass = item.type === "fardhu" ? "row-right-fardhu" : "row-right-sec";

        row.innerHTML = 
          '<div class="' + nameClass + '">' + prayerName + '</div>' +
          '<div class="row-mid">' + badgesHtml + '</div>' +
          '<div class="' + timeClass + '">' + minutesToDisplay(prayerMins) + '</div>';

        list.appendChild(row);
      });
    }

    function determinePrayerState(adjustedTimes) {
      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();
      const currentSecs = now.getSeconds();
      const t = I18N[currentLang];

      const sequence = ALL_KEYS.map(key => ({ key: key, mins: adjustedTimes[key] }));

      let activeItem = null;
      let nextItem = null;

      if (currentMins < sequence[0].mins) {
        activeItem = { key: "isya", name: t.prayers["isya"] + " " + t.yesterdaySuffix, mins: sequence[sequence.length - 1].mins - 1440 };
        nextItem = { key: sequence[0].key, name: t.prayers[sequence[0].key], mins: sequence[0].mins };
      } else {
        for (let i = 0; i < sequence.length; i++) {
          if (i === sequence.length - 1) {
            activeItem = { key: sequence[i].key, name: t.prayers[sequence[i].key], mins: sequence[i].mins };
            nextItem = { key: sequence[0].key, name: t.prayers[sequence[0].key] + " " + t.tomorrowSuffix, mins: sequence[0].mins + 1440 };
          } else if (currentMins >= sequence[i].mins && currentMins < sequence[i + 1].mins) {
            activeItem = { key: sequence[i].key, name: t.prayers[sequence[i].key], mins: sequence[i].mins };
            nextItem = { key: sequence[i + 1].key, name: t.prayers[sequence[i + 1].key], mins: sequence[i + 1].mins };
            break;
          }
        }
      }

      return { active: activeItem, next: nextItem, currentMinutes: currentMins, currentSeconds: currentSecs };
    }

    function updateSkyVisuals(adjustedTimes, currentMins) {
      const skyBg = document.getElementById("sky-bg");
      const celestial = document.getElementById("celestial-body");
      document.getElementById('visuals-toggle').textContent = visualsEnabled ? "☀️" : "🌙";

      if (!visualsEnabled) {
        skyBg.style.background = "var(--bg-base)";
        celestial.style.opacity = "0";
        return;
      }

      const subuhMins = adjustedTimes.subuh;
      const maghribMins = adjustedTimes.maghrib;
      
      let isDay = currentMins >= subuhMins && currentMins < maghribMins;
      celestial.style.opacity = "1";

      if (isDay) {
        let dayProgress = (currentMins - subuhMins) / (maghribMins - subuhMins);
        
        celestial.style.background = "radial-gradient(circle, #fffdf2 0%, #ffe484 50%, transparent 100%)";
        celestial.style.boxShadow = "0 0 40px 20px rgba(255, 228, 132, 0.4)";
        celestial.style.left = (10 + (dayProgress * 80)) + "vw";
        let heightMultiplier = Math.sin(dayProgress * Math.PI); 
        celestial.style.top = (85 - (heightMultiplier * 60)) + "vh";

        if (dayProgress < 0.15) {
          skyBg.style.background = "linear-gradient(to bottom, #0f172a 0%, #312e81 60%, #701a75 100%)"; 
        } else if (dayProgress < 0.3) {
          skyBg.style.background = "linear-gradient(to bottom, #1e3a8a 0%, #7c2d12 60%, #b45309 100%)"; 
        } else if (dayProgress < 0.7) {
          skyBg.style.background = "linear-gradient(to bottom, #0ea5e9 0%, #38bdf8 100%)"; 
        } else if (dayProgress < 0.9) {
          skyBg.style.background = "linear-gradient(to bottom, #1d4ed8 0%, #c2410c 100%)"; 
        } else {
          skyBg.style.background = "linear-gradient(to bottom, #1e1b4b 0%, #831843 60%, #ea580c 100%)"; 
        }

      } else {
        let nightDuration = (1440 - maghribMins) + subuhMins;
        let elapsedNight = currentMins >= maghribMins ? (currentMins - maghribMins) : ((1440 - maghribMins) + currentMins);
        let nightProgress = elapsedNight / nightDuration;

        celestial.style.background = "radial-gradient(circle, #ffffff 0%, #e2e8f0 50%, transparent 100%)";
        celestial.style.boxShadow = "0 0 30px 10px rgba(255, 255, 255, 0.2)";
        celestial.style.left = (10 + (nightProgress * 80)) + "vw";
        let heightMultiplier = Math.sin(nightProgress * Math.PI); 
        celestial.style.top = (75 - (heightMultiplier * 40)) + "vh";

        if (nightProgress < 0.1) {
          skyBg.style.background = "linear-gradient(to bottom, #020617 0%, #172554 100%)"; 
        } else {
          skyBg.style.background = "linear-gradient(to bottom, #000000 0%, #020617 100%)"; 
        }
      }
    }

    function updateTick() {
      const adjustedTimes = getAdjustedSchedule();
      const state = determinePrayerState(adjustedTimes);
      const t = I18N[currentLang];

      if (!state.active || !state.next) return;

      setText("hero-current-name", state.active.name);
      
      let targetMins = state.next.mins;
      let currentTotalSecs = state.currentMinutes * 60 + state.currentSeconds;
      let targetTotalSecs = targetMins * 60;
      let diffSeconds = targetTotalSecs - currentTotalSecs;

      if (diffSeconds < 0) diffSeconds = 0;

      let hours = Math.floor(diffSeconds / 3600);
      let mins = Math.floor((diffSeconds % 3600) / 60);
      let secs = diffSeconds % 60;

      let hStr = hours < 10 ? "0" + hours : hours;
      let mStr = mins < 10 ? "0" + mins : mins;
      let sStr = secs < 10 ? "0" + secs : secs;

      let countdownString = hStr + ":" + mStr + ":" + sStr + " " + t.toNext + " " + state.next.name;
      setText("hero-countdown-text", countdownString);

      let activeMinsDisplay = adjustedTimes[state.active.key] ? minutesToDisplay(adjustedTimes[state.active.key]) : "-";
      setText("hero-current-range", t.enteredAt + " " + activeMinsDisplay);

      let startTotalSecs = state.active.mins * 60;
      let intervalSecs = targetTotalSecs - startTotalSecs;
      let progressPercent = 0;

      if (intervalSecs > 0) {
        let elapsedSecs = currentTotalSecs - startTotalSecs;
        progressPercent = Math.min(100, Math.max(0, (elapsedSecs / intervalSecs) * 100));
      }

      const progressFill = document.getElementById("hero-progress-fill");
      if (progressFill) progressFill.style.width = progressPercent.toFixed(1) + "%";

      renderPrayerList(adjustedTimes, state.active.key);
      updateSkyVisuals(adjustedTimes, state.currentMinutes);
    }

    function setDateHeaders() {
      const now = new Date();
      const gregorianOptions = { weekday: "short", day: "numeric", month: "short", year: "numeric" };
      setText("gregorian-date", now.toLocaleDateString(I18N[currentLang].localeDate, gregorianOptions) + " | " + hijrahString);
    }

    function fetchRemoteData() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, "0");
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const year = now.getFullYear();
      const dateKey = day + "-" + month + "-" + year;

      fetch(GITHUB_JSON_URL)
        .then(res => { if (!res.ok) throw new Error(); return res.json(); })
        .then(data => {
          if (data && data[dateKey]) {
            cachedSchedule = {
              imsak: data[dateKey].imsak, subuh: data[dateKey].subuh, syuruk: data[dateKey].syuruk,
              duha: data[dateKey].duha, zuhur: data[dateKey].zuhur, asar: data[dateKey].asar,
              maghrib: data[dateKey].maghrib, isya: data[dateKey].isya
            };
            if (data[dateKey].date_hijrah) {
              hijrahString = data[dateKey].date_hijrah;
              setDateHeaders();
            }
            updateTick();
          }
        })
        .catch(() => console.warn("Using offline fallback schedule"));
    }

    document.getElementById("visuals-toggle").textContent = visualsEnabled ? "☀️" : "🌙";
    setLanguage("ms");
    fetchRemoteData();
    setInterval(updateTick, 1000);
  </script>
</body>
</html>
