  <style>
    :root {
      /* Slate Dark Gray / Black Theme */
      --bg-base: #050505;
      --bg-surface: #121212;
      --bg-surface-elevated: #1a1a1a;
      --bg-surface-active: #171717;
      --border-subtle: #262626;
      --border-active: #525252;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --accent-primary: #e5e5e5;
      --accent-highlight: #d4d4d4;
      --accent-glow: rgba(255, 255, 255, 0.08);

      /* Status Indicators: Green (Tick) & Red (Cross) */
      --badge-ok-bg: rgba(52, 211, 153, 0.15);
      --badge-ok-color: #34d399; 
      --badge-haram-bg: rgba(244, 63, 94, 0.15);
      --badge-haram-color: #fb7185; 

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100dvh; /* Dynamic Viewport Height fixes iOS bottom bar issues */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      
      /* Safe Area Paddings for Notches and Swipe Bars */
      padding-top: calc(env(safe-area-inset-top, 20px) + 16px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 12px);
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      
      -webkit-font-smoothing: antialiased;
      overflow: hidden; 
    }

    .app-wrapper {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden; /* Prevents stretching */
    }

    /* Fixed Header */
    .header-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0; /* Locks to top */
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 100%;
      height: 100%;
    }

    .header-title-box h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      text-transform: uppercase;
      line-height: 1.1;
      margin: 0;
    }

    .lang-switcher {
      display: flex;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    /* Header Bottom Row (Date & Badge) */
    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(26, 26, 26, 0.4);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .date-text {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .district-badge {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-primary);
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-active);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0; 
    }

    /* Fixed Hero Section */
    .hero-tracker {
      background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(20, 20, 20, 0.95) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0; /* Locks to top under header */
    }

    .hero-tracker::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 150px;
      height: 100%;
      background: radial-gradient(circle at top right, var(--accent-glow) 0%, transparent 80%);
      pointer-events: none;
    }

    .hero-top-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 1;
    }

    .hero-now-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .hero-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
    }

    .hero-time {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1;
      margin-top: 4px;
    }

    .progress-countdown {
      font-size: 0.95rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--border-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-primary);
      border-radius: 999px;
      box-shadow: 0 0 10px var(--accent-primary);
      transition: width 0.8s ease;
    }

    /* Scrollable Unified List */
    .prayer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      flex-grow: 1; /* Takes up remaining middle space */
      overflow-y: auto; /* Allows scrolling */
      -webkit-overflow-scrolling: touch; /* Smooth iOS scroll */
      padding-bottom: 12px;
    }

    .prayer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 10px;
      transition: all 0.2s ease;
      width: 100%;
      flex-shrink: 0; /* Prevents rows from squishing inside scroll view */
    }

    .prayer-row:active {
      transform: scale(0.98);
    }

    /* Primary Fardhu Row Styling */
    .prayer-row.is-fardhu {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 12px 14px;
    }

    /* Secondary Row Styling (Imsak, Syuruk, Duha) */
    .prayer-row.is-secondary {
      background: rgba(18, 18, 18, 0.4);
      border: 1px dashed var(--border-subtle);
      padding: 8px 14px;
    }

    .prayer-row.is-active {
      background: linear-gradient(90deg, var(--bg-surface-active) 0%, var(--bg-surface) 100%);
      border: 1px solid var(--border-active);
      box-shadow: inset 3px 0 0 var(--accent-primary);
    }

    .prayer-row.is-past {
      opacity: 0.35;
      filter: grayscale(1);
    }

    /* Name Formatting */
    .row-left-fardhu {
      width: 80px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .row-left-sec {
      width: 80px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prayer-row.is-active .row-left-fardhu,
    .prayer-row.is-active .row-left-sec {
      color: var(--accent-primary);
    }

    /* Badges */
    .row-mid {
      flex: 1;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-start;
      padding: 0 8px;
    }

    .fiqh-badge {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fiqh-badge.is-ok {
      background-color: var(--badge-ok-bg);
      color: var(--badge-ok-color);
    }

    .fiqh-badge.is-haram {
      background-color: var(--badge-haram-bg);
      color: var(--badge-haram-color);
    }

    /* Time Formatting */
    .row-right-fardhu {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      text-align: right;
    }

    .row-right-sec {
      font-size: 0.95rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      text-align: right;
    }

    .prayer-row.is-active .row-right-fardhu,
    .prayer-row.is-active .row-right-sec {
      color: #ffffff;
    }

    /* Fixed Footer */
    .site-footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.4;
      flex-shrink: 0; /* Locks to bottom */
      padding-top: 4px;
      border-top: 1px solid var(--border-subtle);
      margin-top: auto;
    }

    .site-footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }
  </style>
</head>

              <path d="M90 170c-13.3 0-24 20-24 50h48c0-30-10.7-50-24-50zm332 0c-13.3 0-24 20-24 50h48c0-30-10.7-50-24-50z" fill="#e5e5e5"/>
              <path d="M80 384h352v24H80z" fill="#e5e5e5"/>
            </svg>
          </div>
          <div class="header-title-box">
            <h1 id="ui-app-title">Waktu Solat BWN</h1>
          </div>
        </div>

        <div class="lang-switcher">
          <button id="lang-btn-ms" class="lang-btn active" onclick="setLanguage('ms')">BM</button>
          <button id="lang-btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
      </div>

      <!-- Bottom Row: Date & Badge -->
      <div class="header-bottom">
        <span class="date-text" id="gregorian-date">-</span>
        <span class="district-badge" id="ui-district-badge">Brunei-Muara</span>
      </div>
    </header>

    <section class="hero-tracker">
      <div class="hero-top-row">
        <div class="hero-now-label" id="ui-now-label">Sekarang:</div>
        <div class="hero-name" id="hero-current-name">-</div>
        <div class="hero-time" id="hero-current-range">-</div>
      </div>
      <div class="progress-container">
        <div class="progress-countdown" id="hero-countdown-text">-</div>
        <div class="progress-track">
          <div class="progress-fill" id="hero-progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- Unified Single Screen List (All 8 Windows) -->
    <main class="prayer-list" id="prayer-list-container"></main>

    <footer class="site-footer">
      <div style="padding-top: 4px;">
        <a href="https://www.mora.gov.bn/SitePages/WaktuSembahyang.aspx" target="_blank" rel="noopener noreferrer">Sumber: KHEU Brunei Darussalam</a>
      </div>
      <div>
        &copy; 2026 <a href="https://github.com/naqiuddinihsan" target="_blank" rel="noopener noreferrer">Qwamii / Naqiuddin Ihsan</a>
      </div>
    </footer>
  </div>

  <script>
    const GITHUB_JSON_URL = "https://raw.githubusercontent.com/naqiuddinihsan/waktu-solat-brunei/main/brunei_prayers.json";
    const BASE_DISTRICT_OFFSET = 0;
    
    let currentLang = "ms";

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    const I18N = {
      ms: {
        appTitle: "Waktu Solat BWN",
        nowLabel: "Sekarang:",
        enteredAt: "Masuk pada",
        toNext: "ke",
        districtBadge: "Brunei-Muara",
        localeDate: "ms-MY",
        yesterdaySuffix: "(Malam Tadi)",
        tomorrowSuffix: "(Esok)",
        prayers: {
          imsak: "Imsak",
          subuh: "Subuh",
          syuruk: "Syuruk",
          duha: "Duha",
          zuhur: "Zuhur",
          asar: "Asar",
          maghrib: "Maghrib",
          isya: "Isya'"
        },
        fiqh: {
          qabliyyah: "Qabliyyah",
          ba_diyyah: "Ba'diyyah",
          witir: "Witir"
        }
      },
      en: {
        appTitle: "Waktu Solat BWN",
        nowLabel: "Now:",
        enteredAt: "Entered at",
        toNext: "to",
        districtBadge: "Brunei-Muara",
        localeDate: "en-GB",
        yesterdaySuffix: "(Last Night)",
        tomorrowSuffix: "(Tomorrow)",
        prayers: {
          imsak: "Imsak",
          subuh: "Fajr",
          syuruk: "Sunrise",
          duha: "Dhuha",
          zuhur: "Zuhr",
          asar: "Asr",
          maghrib: "Maghrib",
          isya: "Isha'"
        },
        fiqh: {
          qabliyyah: "Qabliyyah",
          ba_diyyah: "Ba'diyyah",
          witir: "Witir"
        }
      }
    };

    const ALL_KEYS = ["imsak", "subuh", "syuruk", "duha", "zuhur", "asar", "maghrib", "isya"];

    let cachedSchedule = {
      imsak: "04:42",
      subuh: "04:52",
      syuruk: "06:09",
      duha: "06:31",
      zuhur: "12:13",
      asar: "15:22",
      maghrib: "18:15",
      isya: "19:24"
    };
    let hijrahString = "14 Rabiulakhir 1448 H";

    function timeStringToMinutes(str) {
      const parts = str.split(":");
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function minutesToDisplay(mins) {
      let normalized = mins % 1440;
      let h = Math.floor(normalized / 60);
      let m = normalized % 60;
      let period = h >= 12 ? "PM" : "AM";
      let displayH = h % 12;
      displayH = displayH === 0 ? 12 : displayH;
      let displayM = m < 10 ? "0" + m : m;
      return displayH + ":" + displayM + " " + period;
    }

    function setLanguage(lang) {
      currentLang = lang;
      const msBtn = document.getElementById("lang-btn-ms");
      const enBtn = document.getElementById("lang-btn-en");
      if (msBtn) msBtn.classList.toggle("active", lang === "ms");
      if (enBtn) enBtn.classList.toggle("active", lang === "en");

      const t = I18N[currentLang];
      setText("ui-app-title", t.appTitle);
      document.title = t.appTitle;
      setText("ui-now-label", t.nowLabel);
      setText("ui-district-badge", t.districtBadge);

      setDateHeaders();
      updateTick();
    }

    function getAdjustedSchedule() {
      const adjusted = {};
      ALL_KEYS.forEach(function(key) {
        let baseMins = timeStringToMinutes(cachedSchedule[key]);
        adjusted[key] = baseMins + BASE_DISTRICT_OFFSET;
      });
      return adjusted;
    }

    function renderPrayerList(adjustedTimes, activeKey) {
      const list = document.getElementById("prayer-list-container");
      if (!list) return;
      list.innerHTML = "";

      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const t = I18N[currentLang];

      const sequence = [
        { key: "imsak", type: "secondary" },
        {
          key: "subuh", type: "fardhu",
          badges: [
            { text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" },
            { text: t.fiqh.ba_diyyah + " &#10007;", type: "is-haram" }
          ]
        },
        { key: "syuruk", type: "secondary" },
        { key: "duha", type: "secondary" },
        {
          key: "zuhur", type: "fardhu",
          badges: [
            { text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" },
            { text: t.fiqh.ba_diyyah + " &#10003;", type: "is-ok" }
          ]
        },
        {
          key: "asar", type: "fardhu",
          badges: [
            { text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" },
            { text: t.fiqh.ba_diyyah + " &#10007;", type: "is-haram" }
          ]
        },
        {
          key: "maghrib", type: "fardhu",
          badges: [
            { text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" },
            { text: t.fiqh.ba_diyyah + " &#10003;", type: "is-ok" }
          ]
        },
        {
          key: "isya", type: "fardhu",
          badges: [
            { text: t.fiqh.qabliyyah + " &#10003;", type: "is-ok" },
            { text: t.fiqh.ba_diyyah + " &#10003;", type: "is-ok" },
            { text: t.fiqh.witir + " &#10003;", type: "is-ok" }
          ]
        }
      ];

      sequence.forEach(function(item) {
        const row = document.createElement("div");
        row.className = "prayer-row is-" + item.type;

        const prayerMins = adjustedTimes[item.key];
        const prayerName = t.prayers[item.key];
        
        if (item.key === activeKey) {
          row.classList.add("is-active");
        } else if (prayerMins < currentMinutes) {
          row.classList.add("is-past");
        }

        let badgesHtml = '';
        if (item.badges) {
          item.badges.forEach(function(b) {
            badgesHtml += '<span class="fiqh-badge ' + b.type + '">' + b.text + '</span>';
          });
        }

        const nameClass = item.type === "fardhu" ? "row-left-fardhu" : "row-left-sec";
        const timeClass = item.type === "fardhu" ? "row-right-fardhu" : "row-right-sec";

        row.innerHTML = 
          '<div class="' + nameClass + '">' + prayerName + '</div>' +
          '<div class="row-mid">' + badgesHtml + '</div>' +
          '<div class="' + timeClass + '">' + minutesToDisplay(prayerMins) + '</div>';

        list.appendChild(row);
      });
    }

    function determinePrayerState(adjustedTimes) {
      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();
      const currentSecs = now.getSeconds();
      const t = I18N[currentLang];

      const sequence = ALL_KEYS.map(function(key) {
        return { key: key, mins: adjustedTimes[key] };
      });

      let activeItem = null;
      let nextItem = null;

      if (currentMins < sequence[0].mins) {
        activeItem = {
          key: "isya",
          name: t.prayers["isya"] + " " + t.yesterdaySuffix,
          mins: sequence[sequence.length - 1].mins - 1440
        };
        nextItem = {
          key: sequence[0].key,
          name: t.prayers[sequence[0].key],
          mins: sequence[0].mins
        };
      } else {
        for (let i = 0; i < sequence.length; i++) {
          if (i === sequence.length - 1) {
            activeItem = {
              key: sequence[i].key,
              name: t.prayers[sequence[i].key],
              mins: sequence[i].mins
            };
            nextItem = {
              key: sequence[0].key,
              name: t.prayers[sequence[0].key] + " " + t.tomorrowSuffix,
              mins: sequence[0].mins + 1440
            };
          } else if (currentMins >= sequence[i].mins && currentMins < sequence[i + 1].mins) {
            activeItem = {
              key: sequence[i].key,
              name: t.prayers[sequence[i].key],
              mins: sequence[i].mins
            };
            nextItem = {
              key: sequence[i + 1].key,
              name: t.prayers[sequence[i + 1].key],
              mins: sequence[i + 1].mins
            };
            break;
          }
        }
      }

      return {
        active: activeItem,
        next: nextItem,
        currentMinutes: currentMins,
        currentSeconds: currentSecs
      };
    }

    function updateTick() {
      const adjustedTimes = getAdjustedSchedule();
      const state = determinePrayerState(adjustedTimes);
      const t = I18N[currentLang];

      if (!state.active || !state.next) return;

      setText("hero-current-name", state.active.name);
      
      let targetMins = state.next.mins;
      let currentTotalSecs = state.currentMinutes * 60 + state.currentSeconds;
      let targetTotalSecs = targetMins * 60;
      let diffSeconds = targetTotalSecs - currentTotalSecs;

      if (diffSeconds < 0) diffSeconds = 0;

      let hours = Math.floor(diffSeconds / 3600);
      let mins = Math.floor((diffSeconds % 3600) / 60);
      let secs = diffSeconds % 60;

      let hStr = hours < 10 ? "0" + hours : hours;
      let mStr = mins < 10 ? "0" + mins : mins;
      let sStr = secs < 10 ? "0" + secs : secs;

      let countdownString = hStr + ":" + mStr + ":" + sStr + " " + t.toNext + " " + state.next.name;
      setText("hero-countdown-text", countdownString);

      let activeMinsDisplay = adjustedTimes[state.active.key] ? minutesToDisplay(adjustedTimes[state.active.key]) : "-";
      setText("hero-current-range", t.enteredAt + " " + activeMinsDisplay);

      let startTotalSecs = state.active.mins * 60;
      let intervalSecs = targetTotalSecs - startTotalSecs;
      let progressPercent = 0;

      if (intervalSecs > 0) {
        let elapsedSecs = currentTotalSecs - startTotalSecs;
        progressPercent = Math.min(100, Math.max(0, (elapsedSecs / intervalSecs) * 100));
      }

      const progressFill = document.getElementById("hero-progress-fill");
      if (progressFill) progressFill.style.width = progressPercent.toFixed(1) + "%";

      renderPrayerList(adjustedTimes, state.active.key);
    }

    function setDateHeaders() {
      const now = new Date();
      const gregorianOptions = { weekday: "short", day: "numeric", month: "short", year: "numeric" };
      setText("gregorian-date", now.toLocaleDateString(I18N[currentLang].localeDate, gregorianOptions) + " | " + hijrahString);
    }

    function fetchRemoteData() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, "0");
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const year = now.getFullYear();
      const dateKey = day + "-" + month + "-" + year;

      fetch(GITHUB_JSON_URL)
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP error");
          return res.json();
        })
        .then(function(data) {
          if (data && data[dateKey]) {
            cachedSchedule = {
              imsak: data[dateKey].imsak,
              subuh: data[dateKey].subuh,
              syuruk: data[dateKey].syuruk,
              duha: data[dateKey].duha,
              zuhur: data[dateKey].zuhur,
              asar: data[dateKey].asar,
              maghrib: data[dateKey].maghrib,
              isya: data[dateKey].isya
            };
            if (data[dateKey].date_hijrah) {
              hijrahString = data[dateKey].date_hijrah;
              setDateHeaders();
            }
            updateTick();
          }
        })
        .catch(function(err) {
          console.warn("Using internal fallback schedule");
        });
    }

    setLanguage("ms");
    fetchRemoteData();
    setInterval(updateTick, 1000);
  </script>
</body>
</html>
